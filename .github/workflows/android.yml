name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mettre en cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon

      # Si le dépôt ne porte pas de clé, l'APK est signé avec la clé de debug :
      # installable sur un téléphone vierge, mais pas par-dessus une version signée
      # avec la vraie clé.
      - name: Restaurer la clé de signature
        env:
          CLE_ENCODEE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLE_ENCODEE" ]; then
            mkdir -p keystore
            printf '%s' "$CLE_ENCODEE" | base64 -d > keystore/mtgduel.jks
            echo "Clé de release restaurée : l'APK sera installable en mise à jour."
          else
            echo "Pas de clé dans les secrets du dépôt : signature avec la clé de debug."
          fi

      - name: Construire l'APK
        env:
          MTG_KEYSTORE_FILE: keystore/mtgduel.jks
          MTG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MTG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MTG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Nommer l'APK d'après sa version et vérifier sa signature
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          source=app/build/outputs/apk/release/app-release.apk
          cible="MTG-Duel-$version.apk"
          cp "$source" "$cible"
          echo "nom=$cible" >> "$GITHUB_OUTPUT"

          signataire=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          if [ -n "$signataire" ]; then
            "$signataire" verify --print-certs "$cible" | grep -i "DN:" || true
          fi

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: mtg-duel-apk
          path: ${{ steps.apk.outputs.nom }}
          if-no-files-found: error
