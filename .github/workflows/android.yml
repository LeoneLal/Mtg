name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mettre en cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Tests unitaires
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Construire l'APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: mtg-duel-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
